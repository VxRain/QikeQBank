[package]
name = "qbank"
version = "0.1.0"
edition = "2024"

[lib]
name = "qbank_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
flate2 = "1.1"
hmac = "0.12"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-prevent-default = "3"
tauri-plugin-opener = "2"
# S3 通道：flate2 为纯 Rust（无 C 构建）；ureq 走 native-tls（Windows = Schannel，
# 不引入 ring/rustls，便携单 exe 体积增量最小）。注意 ureq 的 TLS provider 默认是
# Rustls 且不会自动切换，必须在 Agent 上显式指定 NativeTls + PlatformVerifier。
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
uuid = { version = "1", features = ["v7"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 便携单 exe 体积优化：s 优化体积 + thin LTO + 去符号
[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"
